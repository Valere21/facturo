<VirtualHost *:80>
    ServerName donald-facturo.duckdns.org

    Alias /.well-known/acme-challenge/ /var/lib/letsencrypt/.well-known/acme-challenge/
    <Directory /var/lib/letsencrypt/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    <Location />
        Require all denied
    </Location>
    <Location /.well-known/acme-challenge/>
        Require all granted
    </Location>
</VirtualHost>
