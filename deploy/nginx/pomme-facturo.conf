server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name donald-pomme.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/donald-pomme.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/donald-pomme.duckdns.org/privkey.pem;

    # Existing Pomme routes deliberately remain separate from Facturo.
    location /pomme/ {
        alias /srv/pomme/;
        autoindex off;
        types { application/json json; application/octet-stream mbtiles graph pbf; }
        default_type application/octet-stream;
        add_header Accept-Ranges bytes;
    }

    location = /pomme-health {
        return 200 "ok\n";
        default_type text/plain;
    }

    # Facturo is reachable only through this HTTPS, authenticated, read-only proxy.
    include /etc/nginx/snippets/facturo-readonly-location.conf;
}
