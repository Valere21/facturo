# À inclure dans le bloc `server` HTTPS de Nginx qui possède le certificat.
# Les routes plus spécifiques de Pomme (/pomme/ et /pomme-health) continuent
# de prévaloir sur cette location racine.
location / {
    auth_basic "Facturo — lecture seule";
    auth_basic_user_file /etc/nginx/.htpasswd-facturo;

    # Même un utilisateur authentifié ne peut pas modifier Facturo depuis
    # Internet. L'application applique la même règle en seconde barrière.
    limit_except GET HEAD {
        deny all;
    }

    proxy_pass http://127.0.0.1:3030;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
}
