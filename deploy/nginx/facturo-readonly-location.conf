# À inclure dans le bloc `server` HTTPS de Nginx qui possède le certificat.
# Le nom du fichier est historique : l'API accepte aussi les écritures
# pour un utilisateur authentifié.
location /api/ {
    auth_basic "Facturo";
    auth_basic_user_file /etc/nginx/.htpasswd-facturo;

    proxy_pass http://127.0.0.1:3030;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
}

location / {
    auth_basic "Facturo";
    auth_basic_user_file /etc/nginx/.htpasswd-facturo;

    # Seule l'interface et les ressources statiques sont en lecture seule.
    limit_except GET HEAD {
        deny all;
    }

    proxy_pass http://127.0.0.1:3030;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
}
