server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name donald-facturo.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/donald-facturo.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/donald-facturo.duckdns.org/privkey.pem;

    include /etc/nginx/snippets/facturo-readonly-location.conf;
}
